policy:
  name: Codex CLI
  url: https://stonewall.sh/policies/codex.yml
  tier: 3
  tags:
    - coding-agent
  description: >
    Allows access to the minimum binaries and locations needed by Codex CLI.
    Intentionally does NOT include any additional, potentially invasive tools like
    sh, bash, git, etc.
bin:
  allowed:
    - codex
    - node
expose:
  write:
    - ~/.codex
