policy:
  name: Gemini CLI
  url: https://stonewall.sh/policies/gemini.yml
  tier: 3
  tags:
    - coding-agent
    - google
  description: >
    Allows access to the minimum binaries and locations needed by Gemini CLI.
    Intentionally does NOT include any additional, potentially invasive tools like
    sh, bash, git, etc.
bin:
  allowed:
    - gemini
    - node
expose:
  write:
    - ~/.gemini
