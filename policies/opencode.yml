policy:
  name: OpenCode
  url: https://stonewall.sh/policies/opencode.yml
  tier: 3
  tags:
    - coding-agent
  description: >
    Allows access to the minimum binaries and locations needed by OpenCode.
    Intentionally does NOT include any additional, potentially invasive tools like
    sh, bash, git, etc.
bin:
  allowed:
    - opencode
expose:
  read:
    - ~/.opencode
  write:
    - ~/.config/opencode
    - ~/.local/share/opencode
    - ~/.local/state/opencode
    - ~/.cache/opencode
