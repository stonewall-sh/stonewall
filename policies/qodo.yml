policy:
  name: Qodo Command
  url: https://stonewall.sh/policies/qodo.yml
  tier: 3
  tags:
    - coding-agent
  description: >
    Allows access to the minimum binaries and locations needed by Qodo Command.
    Intentionally does NOT include any additional, potentially invasive tools like
    sh, bash, git, etc.
bin:
  allowed:
    - qodo
    - node
    - security
expose:
  write:
    - ~/.qodo
