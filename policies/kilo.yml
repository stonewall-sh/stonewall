policy:
  name: Kilo CLI
  url: https://stonewall.sh/policies/kilo.yml
  tier: 3
  tags:
    - coding-agent
  description: >
    Allows access to the minimum binaries and locations needed by Kilo CLI.
    Intentionally does NOT include any additional, potentially invasive tools like
    sh, bash, git, etc.
bin:
  allowed:
    - kilo
    - kilocode
    - node
expose:
  read:
    - ~/.kilo
  write:
    - ~/.config/kilo
    - ~/.local/share/kilo
    - ~/.local/state/kilo
    - ~/.cache/kilo
