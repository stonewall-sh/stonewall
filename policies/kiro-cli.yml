# $schema: https://stonewall.sh/schema.json

####################################################################################
# This is an official stonewall.sh policy and should not be changed locally.       #
# Please always review remote policies before applying them. Stonewall and its     #
# policies come without warranty of any kind. See LICENSE for details.             #
####################################################################################
policy:
  name: Kiro CLI
  url: https://stonewall.sh/policies/kiro-cli.yml
  tier: 3
  tags:
    - coding-agent
    - aws
  description: >
    Allows access to the minimum binaries and locations needed by Kiro CLI.
    Intentionally does NOT include any additional, potentially invasive tools like
    sh, bash, git, etc.
bin:
  allowed:
    - kiro-cli
expose:
  write:
    - ~/.kiro
    - ~/.local/share/kiro-cli
    - ~/Library/Application Support/kiro-cli
