# $schema: https://stonewall.sh/schema.json

###############################################################################
# stonewall.sh Sandbox Policy for Coding Agents                               #
#                                                                             #
# See https://stonewall.sh or run `stonewall --help` for details              #
###############################################################################

include:
  - https://stonewall.sh/policies/base.yml
  - https://stonewall.sh/policies/claude.yml
  - https://stonewall.sh/policies/python.yml
  - https://stonewall.sh/policies/snap.yml

project:
  readonly:
    - README.md
    - SECURITY.md
    - CNAME

bin:
  allowed:
    - node
    - sh
    - bash

expose:
  read:
    - ~/.npm
  write:
    - ~/.cache
